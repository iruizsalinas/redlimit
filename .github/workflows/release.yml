name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check for an untagged version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release version
        id: version
        run: node scripts/check-release.mjs
      - name: Skip existing tags and published versions
        id: check
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing_tag=$(git tag --list "$RELEASE_TAG")
          if [ -n "$existing_tag" ]; then
            echo "Release $RELEASE_TAG already has a tag; skipping."
            echo 'should_release=false' >> "$GITHUB_OUTPUT"
          else
            node scripts/check-npm-version.mjs
          fi

  test:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish tested package to npm
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release
      - name: Publish the tested tarball using OIDC
        shell: bash
        run: |
          shopt -s nullglob
          packages=(./release/*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo 'Expected exactly one tested npm tarball'
            exit 1
          fi
          npm publish "${packages[0]}" --access public --tag latest --ignore-scripts

  tag:
    name: Tag the published commit
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the version tag after publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            --jq '.[] | select(.ref == ("refs/tags/" + env.RELEASE_TAG)) | .object.sha')
          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" = "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG already points to the published commit; skipping."
              exit 0
            fi
            echo "Tag $RELEASE_TAG already points to another commit."
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$GITHUB_SHA"
