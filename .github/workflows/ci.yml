name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_commit:
        type: string
        required: false
        default: ''
  schedule:
    - cron: '37 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, types and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:prepare
        id: package
      - run: npm run test:package-types
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-tests
          path: .ci/consumer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  unit:
    name: Unit / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24', '26']
        os: [ubuntu-24.04]
        include:
          - { node: '24', os: windows-2025 }
          - { node: '24', os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  node:
    name: Node ${{ matrix.node }} / ${{ matrix.server || 'Redis' }} ${{ matrix.redis }} / ${{ matrix.client }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['20.0.0', '20', '22', '24', '26']
        redis: ['8.10.2-alpine']
        client: [redis, ioredis]
        include:
          # Redis 5 is legacy coverage for the documented minimum.
          - { node: '24', redis: '5.0.14-alpine', client: redis }
          - { node: '24', redis: '5.0.14-alpine', client: ioredis }
          - { node: '24', redis: '6.2.24-alpine', client: redis }
          - { node: '24', redis: '6.2.24-alpine', client: ioredis }
          - { node: '24', redis: '7.4.11-alpine', client: redis }
          - { node: '24', redis: '7.4.11-alpine', client: ioredis }
          # Valkey is the common open-source Redis replacement; same scripts, separate codebase.
          - { node: '24', server: Valkey, image: valkey/valkey, redis: '9.1.2-alpine', client: redis }
          - { node: '24', server: Valkey, image: valkey/valkey, redis: '9.1.2-alpine', client: ioredis }
          - { node: '24', server: Valkey, image: valkey/valkey, redis: '9.1.2-alpine', client: iovalkey }
          - { node: '24', server: Valkey, image: valkey/valkey, redis: '9.1.2-alpine', client: glide }
    services:
      redis:
        image: ${{ matrix.image || 'redis' }}:${{ matrix.redis }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_CLIENT: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      # Install tooling on LTS; run the packed library on the selected runtime.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-tests
          path: .ci/consumer
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node scripts/run-runtime.mjs node

  cluster:
    name: Node 24 / Redis 8 Cluster / ${{ matrix.client }} / ${{ matrix.masters }} masters
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        client: [redis, ioredis, iovalkey, glide]
        masters: [1, 3]
    env:
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_CLIENT: ${{ matrix.client }}
      REDIS_TOPOLOGY: cluster
      REDIS_CLUSTER_MASTERS: ${{ matrix.masters }}
    steps:
      # Service containers cannot pass server arguments, so start the node directly.
      # One node owning every slot still rejects CROSSSLOT multi-key commands and
      # exercises the cluster clients' routing and adapter detection.
      - name: Start single-node Redis Cluster
        if: matrix.masters == 1
        run: |
          docker run -d --name redis-cluster -p 6379:6379 redis:8.10.2-alpine \
            redis-server --cluster-enabled yes --cluster-announce-ip 127.0.0.1
          for attempt in $(seq 1 30); do
            docker exec redis-cluster redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec redis-cluster redis-cli cluster addslotsrange 0 16383
          for attempt in $(seq 1 30); do
            if docker exec redis-cluster redis-cli cluster info | grep -q 'cluster_state:ok'; then
              exit 0
            fi
            sleep 1
          done
          docker exec redis-cluster redis-cli cluster info
          exit 1
      - name: Start three-master Redis Cluster
        if: matrix.masters == 3
        run: |
          for port in 6379 6380 6381; do
            docker run -d --name redis-cluster-$port --network host redis:8.10.2-alpine \
              redis-server --port "$port" --cluster-enabled yes --cluster-announce-ip 127.0.0.1
          done
          for port in 6379 6380 6381; do
            for attempt in $(seq 1 30); do
              docker exec redis-cluster-$port redis-cli -p "$port" ping >/dev/null 2>&1 && break
              sleep 1
            done
          done
          docker exec redis-cluster-6379 redis-cli --cluster create \
            127.0.0.1:6379 127.0.0.1:6380 127.0.0.1:6381 --cluster-replicas 0 --cluster-yes
          for attempt in $(seq 1 30); do
            if docker exec redis-cluster-6379 redis-cli cluster info | grep -q 'cluster_state:ok'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-tests
          path: .ci/consumer
      - if: matrix.masters == 1
        run: node scripts/run-runtime.mjs node
      - if: matrix.masters == 3
        run: node .ci/consumer/cluster-routing.test.mjs

  runtime:
    name: ${{ matrix.runtime }} / Redis 8 / ${{ matrix.client }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
        client: [redis, ioredis]
    services:
      redis:
        image: redis:8.10.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_CLIENT: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-tests
          path: .ci/consumer
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ github.event_name == 'schedule' && 'latest' || '1.4.3' }}
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ github.event_name == 'schedule' && 'latest' || 'v2.9.7' }}
      - run: node scripts/run-runtime.mjs "${{ matrix.runtime }}"

  passed:
    name: CI passed
    if: always()
    needs: [build, unit, node, cluster, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required CI job failed or was skipped."
              exit 1
            fi
          done
