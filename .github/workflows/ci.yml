name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '37 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, types and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:prepare
        id: package
      - run: npm run test:package-types
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-tests
          path: .ci/consumer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  unit:
    name: Unit / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24', '26']
        os: [ubuntu-24.04]
        include:
          - { node: '24', os: windows-2025 }
          - { node: '24', os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  node:
    name: Node ${{ matrix.node }} / Redis ${{ matrix.redis }} / ${{ matrix.client }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['20.0.0', '20', '22', '24', '26']
        redis: ['8.10.2-alpine']
        client: [redis, ioredis]
        include:
          # Redis 5 is legacy coverage for the documented minimum.
          - { node: '24', redis: '5.0.14-alpine', client: redis }
          - { node: '24', redis: '5.0.14-alpine', client: ioredis }
          - { node: '24', redis: '6.2.24-alpine', client: redis }
          - { node: '24', redis: '6.2.24-alpine', client: ioredis }
          - { node: '24', redis: '7.4.11-alpine', client: redis }
          - { node: '24', redis: '7.4.11-alpine', client: ioredis }
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_CLIENT: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install tooling on LTS; run the packed library on the selected runtime.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-tests
          path: .ci/consumer
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node scripts/run-runtime.mjs node

  runtime:
    name: ${{ matrix.runtime }} / Redis 8 / ${{ matrix.client }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
        client: [redis, ioredis]
    services:
      redis:
        image: redis:8.10.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_CLIENT: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-tests
          path: .ci/consumer
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ github.event_name == 'schedule' && 'latest' || '1.4.3' }}
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ github.event_name == 'schedule' && 'latest' || 'v2.9.7' }}
      - run: node scripts/run-runtime.mjs "${{ matrix.runtime }}"

  passed:
    name: CI passed
    if: always()
    needs: [build, unit, node, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required CI job failed or was skipped."
              exit 1
            fi
          done
